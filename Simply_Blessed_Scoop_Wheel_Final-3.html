<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simply Blessed Scoop Wheel</title>
<style>
body{margin:0;background:#fff4ed;color:#4b3328;font-family:Georgia,serif}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:#fffaf5;border:3px solid #d99aa2;border-radius:24px;padding:16px}h1{text-align:center;color:#b85f6d;font-style:italic}.sub{text-align:center;font-weight:bold}.wheel{position:relative;width:min(94vw,620px);aspect-ratio:1;margin:12px auto}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #b85f6d;z-index:2}canvas{width:100%;height:100%;transition:transform 4s cubic-bezier(.12,.75,.18,1)}label{font-weight:bold}input{width:100%;padding:13px;margin:6px 0 8px;border:1px solid #d5b0a2;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;margin-top:9px;border:0;border-radius:13px;background:#b85f6d;color:#fff;font-weight:bold;font-size:18px}button:disabled{opacity:.5}.send{background:#668b6d}.result{text-align:center;padding:12px;margin-top:9px;border:1px dashed #d5b0a2;border-radius:12px}.result strong{display:block;color:#b85f6d;font-size:24px}.history{margin-top:10px;padding:10px;background:#fff2e9;border-radius:10px}.history div{padding:4px 0}
</style></head><body><div class="wrap"><div class="card"><h1>Simply Blessed</h1><div class="sub">💗 SB SCOOP SPIN WHEEL 💗<br>26 ITEMS • UP TO 15 SPINS</div>
<label>Customer name / order number</label><input id="name" placeholder="Enter name or order number">
<div class="wheel"><div class="pointer"></div><canvas id="c" width="700" height="700"></canvas></div>
<button id="spin">SPIN THE WHEEL</button><div class="result" id="res">Your scoop awaits!<strong>Good luck! 💕</strong></div>
<div class="history" id="hist"><b>Selected scoops:</b></div><button class="send" id="send" disabled>📲 SEND RESULTS TO SIMPLY BLESSED</button>
<p style="font-size:13px;text-align:center;line-height:1.4"><b>Each selected item is removed after a spin, so there are no repeats.</b><br>After spinning, send the results to Simply Blessed on WhatsApp so your scoop can be packed.</p>
</div></div>
<script>
const I=["Glue","Pockets","Sticky Notes","Pearls","Mystery Gift","Rhinestones","Wax Stickers","Novelty Pen","Mystery Gift","Highlighter","Markers","Frames","Tags","Die Cuts","Embossed Paper","Affirmations","Alphabet","Leaves & Flowers","Stickers","Lace & Ribbons","Ephemera","Washi Tape","Mini Notebook","Page Holders","Vintage Words","Bookmarks"];
let A=[...I],S=[],n=0,rot=0,busy=false;const c=document.getElementById("c"),x=c.getContext("2d"),btn=document.getElementById("spin"),res=document.getElementById("res"),hist=document.getElementById("hist"),send=document.getElementById("send"),name=document.getElementById("name"),TAU=2*Math.PI;
function draw(){let q=350,r=320,s=TAU/I.length;x.clearRect(0,0,700,700);I.forEach((v,i)=>{let a=-Math.PI/2+i*s,b=a+s,m=(a+b)/2;x.beginPath();x.moveTo(q,q);x.arc(q,q,r,a,b);x.closePath();x.fillStyle=i%2?"#f0d5c8":"#f9e9dc";x.fill();x.strokeStyle="#c99b89";x.stroke();x.save();x.translate(q+Math.cos(m)*r*.68,q+Math.sin(m)*r*.68);x.rotate(m+Math.PI/2);x.fillStyle="#4b3328";x.font="bold 14px Georgia";x.textAlign="center";v.split(" ").forEach((w,j)=>x.fillText(w,(j-(v.split(" ").length-1)/2)*16,0));x.restore()});x.beginPath();x.arc(q,q,75,0,TAU);x.fillStyle="#fffaf5";x.fill();x.strokeStyle="#b85f6d";x.lineWidth=7;x.stroke();x.fillStyle="#b85f6d";x.font="bold 20px Georgia";x.textAlign="center";x.fillText("SB",q,q);x.font="bold 13px Georgia";x.fillText("SCOOPS",q,q+20)}
function spin(){if(busy||n>=15)return;if(!name.value.trim()){alert("Please enter the customer name or order number.");return}busy=true;btn.disabled=true;let p=A[Math.floor(Math.random()*A.length)],i=I.indexOf(p),s=TAU/I.length,target=-(i*s+s/2),cur=rot%TAU,d=target-cur;if(d<0)d+=TAU;rot+=TAU*(5+Math.floor(Math.random()*3))+d;c.style.transform=`rotate(${rot}rad)`;setTimeout(()=>{n++;S.push(p);A=A.filter(v=>v!==p);let row=document.createElement("div");row.textContent=n+". "+p;hist.appendChild(row);res.innerHTML="🎉 SCOOP SELECTED<strong>"+p+"</strong>";busy=false;btn.disabled=n>=15;send.disabled=false;if(n>=15)btn.textContent="15 SPINS COMPLETED"},4100)}
function sendWA(){let m="🌸 SB SCOOP RESULT 🌸\nCustomer/Order: "+name.value.trim()+"\n\n"+S.map((v,i)=>(i+1)+". "+v).join("\n")+"\n\nTotal spins: "+S.length;location.href="https://wa.me/27768370983?text="+encodeURIComponent(m)}
btn.onclick=spin;send.onclick=sendWA;draw();
</script></body></html>
